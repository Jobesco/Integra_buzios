services:
  front:
    image: front:latest
    restart: on-failure
    ports:
      - 3015:3015 # TODO get from envfile (or .env?????)
    networks:
      - local
    build:
      context: ./front
      dockerfile: Dockerfile.dev # TODO differentiate!!
    extra_hosts:
      - host.docker.internal:host-gateway
    # TODO remove after devving!
    volumes:
      - ./front/src:/app/src:ro
    env_file:
      - ./front/.env

  integra:
    image: integra:latest
    restart: on-failure
    ports:
      - 8080:8080
    networks:
      - local
    build:
      context: ./integra
      dockerfile: Dockerfile
    extra_hosts:
      - host.docker.internal:host-gateway
    env_file:
      - ./integra/.env

  db:
    image: mysql:9.2.0
    restart: always
    ports:
      - 3306:3306
    environment:
      - MYSQL_ROOT_PASSWORD=34313407A
      - MYSQL_DATABASE=integrabuzios
    networks:
      - local

networks:
  local:
    name: integra_buzios
